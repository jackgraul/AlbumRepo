name: Build and Deploy

on:
  push:
    branches:
      - master
      - auth

jobs:
  backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: jackgraul/albumrepo-backend:latest

      - name: Deploy backend to Render
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

  frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: jackgraul/albumrepo-frontend:latest

      - name: Deploy frontend to Render
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

  test:
    name: Test Deployment
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Frontend to become ready
        run: |
          echo "Waiting for Render frontend..."
          URL="https://albumrepo-frontend.onrender.com"
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl --silent --fail --output /dev/null "$URL"; then
              echo "Frontend is live!"
              exit 0
            fi
            echo "Frontend is still starting up... Retrying in ${INTERVAL}s."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Error: Frontend timed out."
          exit 1

      - name: Wait for Backend Health Check
        run: |
          echo "Waiting for Render backend actuator health..."
          URL="https://albumrepo-backend.onrender.com/actuator/health"
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl --silent --fail "$URL" | grep -q '"status":"UP"'; then
              echo "Backend is up, healthy, and connected to PostgreSQL!"
              exit 0
            fi
            echo "Backend is still starting up... Retrying in ${INTERVAL}s."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Error: Backend health check timed out."
          exit 1