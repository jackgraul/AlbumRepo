name: Build and Deploy

on:
  push:
    branches:
      - master
      - auth

jobs:
  backend:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: jackgraul/albumrepo-backend:latest

      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"

      - name: Deploy backend and wait for completion
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
          CI: true
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --image docker.io/jackgraul/albumrepo-backend:latest \
            --wait \
            --output json \
            --confirm

  frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: jackgraul/albumrepo-frontend:latest

      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"

      - name: Deploy frontend and wait for completion
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
          CI: true
        run: |
          render deploys create "$RENDER_SERVICE_ID" \
            --image docker.io/jackgraul/albumrepo-frontend:latest \
            --wait \
            --output json \
            --confirm

  test:
    name: Test Deployment
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Wait for Frontend to become ready
        run: |
          echo "Waiting for Render frontend..."

          URL="https://albumrepo-frontend.onrender.com"
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl --silent --fail --output /dev/null "$URL"; then
              echo "Frontend is live!"
              exit 0
            fi

            echo "Frontend is still starting... Retrying."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Error: Frontend timed out."
          exit 1

      - name: Verify Backend Health
        run: |
          echo "Checking backend health..."

          URL="https://albumrepo-backend.onrender.com/actuator/health"
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            RESPONSE=$(curl --silent --fail "$URL" || true)

            if echo "$RESPONSE" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Backend is healthy!"
              exit 0
            fi

            echo "Backend is still starting... Retrying."
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Error: Backend health check timed out."
          exit 1